# Папка с таблицами и изображениями
data_dir: data

# Размер batch
batch_size: 8

# Размер изображения
image_size: 224

# Доля данных для validation
validation_size: 0.2

# Значение для воспроизводимости
seed: 42

# Для стабильной работы Jupyter на Windows
num_workers: 0

# Готовые веса мультимодальной модели
initial_checkpoint: artifacts/best_model_finetuned.pt

# Разморозить последний блок EfficientNet
fine_tune_image: true

# Максимальное количество эпох
epochs: 15

# Learning rate для обучения поправки
learning_rate: 0.001

# Остановка после трёх эпох без улучшения
patience: 3

# Параметры Ridge
ridge_alpha: 10.0
ridge_folds: 5

# Сохранение обученного Ridge
ridge_model_path: artifacts/ridge_residual.joblib

# Сохранение нейросетевой поправки
checkpoint_path: artifacts/best_model_residual.pt